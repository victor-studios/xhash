<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="none">
  <!-- XHash Logo: Stylized X icon + HASH text -->
  
  <!-- X Icon Symbol -->
  <g transform="translate(0, 0)">
    <!-- Left leg going down-right -->
    <polygon points="0,0 14,0 42,40 14,80 0,80 28,40" fill="white"/>
    <!-- Right leg going down-left -->
    <polygon points="66,0 80,0 52,40 80,80 66,80 38,40" fill="white"/>
    <!-- Arrow/notch cut from top-center going into the X -->
    <polygon points="28,0 40,18 52,0 40,0" fill="black" opacity="0"/>
    <!-- Top-right arrow cut -->
    <polygon points="34,0 48,0 40,13" fill="white"/>
    <!-- Create the arrow notch effect: triangle cut from top -->
    <path d="M14,0 L34,0 L40,10 L28,10 Z" fill="white"/>
    <path d="M48,0 L66,0 L52,10 L40,10 Z" fill="white"/>
    <!-- Clean arrow shape cutting into top -->
    <path d="M30,0 L40,14 L50,0 Z" fill="black"/>
  </g>
  
  <!-- H -->
  <path d="M110,20 L116,20 L116,46 L144,46 L144,20 L150,20 L150,64 L144,64 L144,52 L116,52 L116,64 L110,64 Z" fill="white"/>
  
  <!-- A -->
  <path d="M166,64 L160,64 L180,20 L186,20 L206,64 L200,64 L193,48 L173,48 Z M175,42 L191,42 L183,24 Z" fill="white"/>
  
  <!-- S -->
  <path d="M220,58 C225,62 232,65 240,65 C250,65 256,60 256,54 C256,48 252,45 240,42 C228,39 222,34 222,26 C222,18 229,14 240,14 C248,14 254,16 258,20 L254,25 C250,22 246,20 240,20 C232,20 228,24 228,28 C228,34 232,36 244,39 C254,42 262,46 262,56 C262,64 255,71 240,71 C230,71 223,68 218,63 Z" fill="white"/>
  
  <!-- H -->
  <path d="M280,20 L286,20 L286,46 L314,46 L314,20 L320,20 L320,64 L314,64 L314,52 L286,52 L286,64 L280,64 Z" fill="white"/>
</svg>
